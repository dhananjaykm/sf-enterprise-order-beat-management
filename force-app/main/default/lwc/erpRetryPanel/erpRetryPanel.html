<!-- MIGRATION_CLASSIFICATION: APEX_REQUIRED -->
<template>
    <lightning-card title="ERP Retry" icon-name="custom:custom63">
        <div class="slds-p-horizontal_small">
            <template if:true={error}>
                <div class="slds-text-color_error" role="alert">{error}</div>
            </template>
            <lightning-datatable
                key-field="id"
                data={rows}
                columns={columns}
                onrowaction={handleRowAction}
                hide-checkbox-column="false">
            </lightning-datatable>
            <div class="slds-m-top_small">
                <lightning-button label="Refresh" onclick={handleRefresh}></lightning-button>
                <lightning-button class="slds-m-left_x-small" variant="brand" label="Apply" onclick={handleApply}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
